name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-dbus python3-gi gir1.2-soup-3.0 gir1.2-gstreamer-1.0
      - run: python3 -m unittest -v tests/test_streamguard.py
      - run: python3 -m py_compile streamguard/*.py
      - run: bash -n install.sh
